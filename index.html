// ===== IMAGE COMPRESS =====
function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        canvas.width = Math.max(1, Math.round(w));
        canvas.height = Math.max(1, Math.round(h));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    '<span class="lic">' + (LINK_ICONS[l.icon] || LINK_ICONS.link) + '</span>' +
    '<span class="lt">' + esc(l.title) + '</span>' +
    '<span class="lar"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span></a>'
  ).join('');

  // Social HTML
  let socialHTML = '';
  for (const s of SOC_LIST) {
    if (data.socials[s.key] && SOC_SVG[s.key]) {
      socialHTML += '<a href="#" aria-label="' + s.label + '">' + SOC_SVG[s.key] + '</a>';
    }
  }

  document.getElementById('app').innerHTML =
    '<div class="ct" style="--pcols:' + pcols + '">' +
    '<div class="avatar-wrap a a1" onclick="openEditor()" title="Klik untuk ganti foto">' + avatarHTML + '</div>' +
    '<h1 class="name a a2">' + esc(data.name) + '</h1>' +
    (data.bio ? '<p class="bio a a3">' + esc(data.bio) + '</p>' : '') +
    '<div class="sep a a4"></div>' +
    (data.products.length ? '<div class="a a5"><div class="slbl">Produk Rekomendasi</div><div class="pgrid">' + prodsHTML + '</div></div><div class="sep a a' + (5 + data.products.length) + '"></div>' : '') +
    '<div class="ll">' + linksHTML + '</div>' +
    (socialHTML ? '<div class="sr a a15">' + socialHTML + '</div>' : '') +
    '<div class="foot">linkareadiskon.id/' + esc(data.username) + '</div>' +
    '</div>';
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== EDITOR =====
function openEditor() {
  editProducts = JSON.parse(JSON.stringify(data.products));
  editLinks = JSON.parse(JSON.stringify(data.links));
  renderEditor();
  document.getElementById('editorModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditor() {
  document.getElementById('editorModal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderEditor() {
  const t = THEMES[data.theme] || THEMES.mint;
  const themeKeys = ['mint', 'gold', 'rose', 'violet', 'red'];
  const themeGrads = [
    'linear-gradient(135deg,#00E5A0,#38BDF8)',
    'linear-gradient(135deg,#FFB800,#FF6B35)',
    'linear-gradient(135deg,#F472B6,#EC4899)',
    'linear-gradient(135deg,#A78BFA,#8B5CF6)',
    'linear-gradient(135deg,#FF4757,#DC2626)',
  ];

  let html = '';

  // Avatar upload
  html += '<div style="margin-bottom:20px">';
  html += '<label class="slbl" style="display:block;margin-bottom:8px">Foto Profil / Logo</label>';
  html += '<div class="img-up" id="avatarUploadArea">';
  if (data.avatar) {
    html += '<img src="' + data.avatar + '" alt="avatar" id="avatarPreview">';
  } else {
    html += '<div style="padding:8px 0"><svg width="32" height="32" fill="none" stroke="#65657A" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 8px;display:block"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><div style="font-size:12px;color:#65657A">Klik untuk upload gambar</div><div style="font-size:10px;color:#3A3A50;margin-top:2px">JPG, PNG, max 2MB</div></div>';
  }
  html += '<input type="file" accept="image/jpeg,image/png,image/webp" onchange="handleAvatarUpload(this)">';
  html += '</div>';
  if (data.avatar) {
    html += '<button onclick="removeAvatar()" class="btn-g" style="margin-top:8px;font-size:11px;padding:6px 14px">Hapus Foto</button>';
  }
  html += '</div>';

  // Name & Username
  html += '<div style="display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:16px">';
  html += '<div><label class="slbl" style="display:block;margin-bottom:4px">Nama</label><input class="inp" value="' + esc(data.name) + '" oninput="data.name=this.value" placeholder="Nama Kamu"></div>';
  html += '<div><label class="slbl" style="display:block;margin-bottom:4px">Username</label><input class="inp" value="' + esc(data.username) + '" oninput="data.username=this.value.replace(/[^a-z0-9_-]/gi,\'\').toLowerCase()" placeholder="username"></div>';
  html += '</div>';

  // Bio
  html += '<div style="margin-bottom:20px"><label class="slbl" style="display:block;margin-bottom:4px">Bio</label><textarea class="inp" rows="2" oninput="data.bio=this.value" placeholder="Tentang kamu...">' + esc(data.bio) + '</textarea></div>';

  // Theme
  html += '<div style="margin-bottom:20px"><label class="slbl" style="display:block;margin-bottom:8px">Tema Warna</label><div style="display:flex;gap:10px">';
  themeKeys.forEach((k, i) => {
    html += '<div class="tdot ' + (data.theme === k ? 'on' : '') + '" style="background:' + themeGrads[i] + '" onclick="data.theme=\'' + k + '\';renderEditor()"></div>';
  });
  html += '</div></div>';

  // Products
  html += '<div style="margin-bottom:20px">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><label class="slbl" style="margin:0">Produk (' + editProducts.length + ')</label><button class="btn-p" style="font-size:11px;padding:5px 12px" onclick="addEditProduct()">+ Tambah</button></div>';
  html += '<div style="display:grid;grid-template-columns:repeat(' + Math.min(Math.max(editProducts.length, 1), 3) + ',1fr);gap:10px" id="editProdGrid">';
  editProducts.forEach((p, i) => {
    html += '<div class="pe-card" style="position:relative">';
    html += '<div style="position:relative"><img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">';
    html += '<button class="pe-del" onclick="removeEditProduct(' + i + ')"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    html += '</div>';
    html += '<div style="padding:8px"><input class="inp inp-sm" value="' + esc(p.name) + '" oninput="editProducts[' + i + '].name=this.value" placeholder="Nama produk" style="margin-bottom:4px">';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><input class="inp inp-sm" value="' + esc(p.price) + '" oninput="editProducts[' + i + '].price=this.value" placeholder="Harga">';
    html += '<input class="inp inp-sm" value="' + esc(p.comm) + '" oninput="editProducts[' + i + '].comm=this.value" placeholder="Komisi"></div>';
    html += '<div class="img-up" style="margin-top:6px;padding:8px"><input type="file" accept="image/jpeg,image/png,image/webp" onchange="handleProdImg(this,' + i + ')"><div style="font-size:10px;color:#65657A">Ganti gambar</div></div>';
    html += '</div></div>';
  });
  html += '</div></div>';

  // Links
  html += '<div style="margin-bottom:20px">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><label class="slbl" style="margin:0">Link Items (' + editLinks.length + ')</label><button class="btn-p" style="font-size:11px;padding:5px 12px" onclick="addEditLink()">+ Tambah</button></div>';
  editLinks.forEach((l, i) => {
    html += '<div class="le-row"><svg width="14" height="14" fill="none" stroke="#65657A" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><input class="inp inp-sm" value="' + esc(l.title) + '" oninput="editLinks[' + i + '].title=this.value" placeholder="Judul link"><button onclick="removeEditLink(' + i + ')" style="background:none;border:none;color:#FF4757;cursor:pointer;padding:4px;flex-shrink:0"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/></svg></button></div>';
  });
  html += '</div>';

  // Socials
  html += '<div style="margin-bottom:24px"><label class="slbl" style="display:block;margin-bottom:8px">Sosial Media</label><div style="display:flex;gap:8px;flex-wrap:wrap">';
  SOC_LIST.forEach(s => {
    const on = data.socials[s.key];
    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid ' + (on ? t.c + '33' : '#1F1F32') + ';background:' + (on ? t.bg : 'transparent') + ';transition:all .15s;font-size:12px;color:' + (on ? t.c : '#65657A') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="data.socials[\'' + s.key + '\']=this.checked;renderEditor()" style="display:none">' + s.label + '</label>';
  });
  html += '</div></div>';

  // Save button
  html += '<div style="display:flex;gap:10px;padding-bottom:8px">';
  html += '<button class="btn-g" style="flex:1" onclick="closeEditor()">Batal</button>';
  html += '<button class="btn-p" style="flex:2" onclick="saveAndRender()">Simpan Perubahan</button>';
  html += '</div>';

  document.getElementById('editorBody').innerHTML = html;
}

// ===== EDITOR ACTIONS =====
async function handleAvatarUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('Ukuran file maksimal 2MB'); return; }
  try {
    data.avatar = await compressImage(file, 400, 400, 0.75);
    saveData();
    render();
    renderEditor();
  } catch (e) { alert('Gagal memproses gambar'); }
}

function removeAvatar() {
  data.avatar = null;
  saveData();
  render();
  renderEditor();
}

function addEditProduct() {
  const name = PROD_NAMES[Math.floor(Math.random() * PROD_NAMES.length)];
  const seed = 'np' + Math.floor(Math.random() * 99999);
  editProducts.push({
    name,
    price: 'Rp ' + (Math.floor(Math.random() * 300 + 50)) + 'rb',
    comm: Math.floor(Math.random() * 25 + 10) + '%',
    img: 'https://picsum.photos/seed/' + seed + '/300/300.jpg',
    url: '',
  });
  renderEditor();
}

function removeEditProduct(i) {
  editProducts.splice(i, 1);
  renderEditor();
}

async function handleProdImg(input, i) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('Ukuran file maksimal 2MB'); return; }
  try {
    editProducts[i].img = await compressImage(file, 400, 400, 0.75);
    renderEditor();
  } catch (e) { alert('Gagal memproses gambar'); }
}

function addEditLink() {
  const icons = Object.keys(LINK_ICONS);
  editLinks.push({ title: 'Link Baru', icon: icons[Math.floor(Math.random() * icons.length)], url: '' });
  renderEditor();
}

function removeEditLink(i) {
  editLinks.splice(i, 1);
  renderEditor();
}

function saveAndRender() {
  data.products = JSON.parse(JSON.stringify(editProducts));
  data.links = JSON.parse(JSON.stringify(editLinks));
  // Clean empty URLs
  data.products.forEach(p => { if (!p.url) p.url = 'https://linkareadiskon.id/go/' + p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'); });
  data.links.forEach(l => { if (!l.url) l.url = 'https://linkareadiskon.id/go/' + l.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'); });
  saveData();
  render();
  closeEditor();
}

// Close modal on backdrop click
document.getElementById('editorModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditor();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeEditor();
});

// ===== INIT =====
loadData();
render();
</script>
</body>
</html>
